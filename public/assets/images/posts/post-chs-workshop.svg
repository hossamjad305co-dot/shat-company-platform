<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="700" cy="80" r="180" fill="#10b981" fill-opacity="0.15" filter="blur(40px)" />
  <circle cx="120" cy="380" r="140" fill="#34d399" fill-opacity="0.12" filter="blur(30px)" />

  <!-- Decorative Top Status Bar -->
  <g transform="translate(48, 36)">
    <rect width="210" height="32" rx="16" fill="#ffffff" fill-opacity="0.15" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="20" cy="16" r="5" fill="#34d399" />
    <text x="34" y="21" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">ورشة عمل معتمدة • CHS</text>

    <!-- Post Date -->
    <text x="704" y="21" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="600" fill="#a7f3d0" text-anchor="end">سبتمبر 2026 • الميدان التدريبي</text>
  </g>

  <!-- Main Focal Card -->
  <g transform="translate(48, 90)">
    <rect width="704" height="260" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18" />

    <!-- Left Graphic Icon Badge -->
    <g transform="translate(540, 40)">
      <circle cx="65" cy="65" r="62" fill="#ffffff" fill-opacity="0.1" stroke="#34d399" stroke-width="2" />
      <circle cx="65" cy="65" r="48" fill="#064e3b" />
      <!-- Graduation / Training Symbol -->
      <path d="M65 38 L95 54 L65 70 L35 54 Z" fill="#34d399" />
      <path d="M45 60 L45 78 Q65 90 85 78 L85 60 Q65 72 45 60 Z" fill="#ffffff" fill-opacity="0.9" />
      <circle cx="95" cy="68" r="3" fill="#fbbf24" />
      <path d="M95 70 L95 85" stroke="#fbbf24" stroke-width="2" />
    </g>

    <!-- Main Title & Description -->
    <text x="490" y="65" font-family="'Cairo', system-ui, sans-serif" font-size="25" font-weight="800" fill="#ffffff" text-anchor="end">
      المعيار الإنساني الأساسي للجودة والمساءلة (CHS)
    </text>
    <text x="490" y="100" font-family="'Cairo', system-ui, sans-serif" font-size="16" font-weight="600" fill="#a7f3d0" text-anchor="end">
      تطبيق الالتزامات التسعة لتعزيز المساءلة للمجتمعات المتأثرة
    </text>

    <text x="490" y="140" font-family="'Cairo', system-ui, sans-serif" font-size="14" font-weight="400" fill="#e2e8f0" text-anchor="end" opacity="0.95">
      اختتام البرنامج التفاعلي لبناء قدرات الكوادر الإنسانية وفرق المنظمات الشريكة
    </text>
    <text x="490" y="165" font-family="'Cairo', system-ui, sans-serif" font-size="14" font-weight="400" fill="#e2e8f0" text-anchor="end" opacity="0.95">
      وفق أدلة Sphere Handbook ومصفوفة قياس الأداء المؤسسي الدولي.
    </text>

    <!-- Highlight Badges Inside Card -->
    <g transform="translate(40, 195)">
      <rect x="0" y="0" width="140" height="34" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
      <text x="70" y="22" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">✓ 9 التزامات دولية</text>

      <rect x="155" y="0" width="150" height="34" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
      <text x="230" y="22" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">📋 مصفوفة امتثال CHS</text>

      <rect x="320" y="0" width="165" height="34" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
      <text x="402" y="22" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">🎓 شهادات تدريب معتمدة</text>
    </g>
  </g>

  <!-- Bottom Brand Watermark Strip -->
  <g transform="translate(48, 385)">
    <text x="0" y="25" font-family="'Outfit', system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="1">SHAT</text>
    <text x="65" y="25" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="600" fill="#6ee7b7">Development &amp; Growth • شركة شات للتنمية والتطوير</text>

    <!-- Social View Indicator -->
    <g transform="translate(560, 2)">
      <rect width="144" height="34" rx="17" fill="url(#accentGrad)" />
      <text x="72" y="22" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="800" fill="#022c22" text-anchor="middle">منشور موثق ↗</text>
    </g>
  </g>
</svg>
