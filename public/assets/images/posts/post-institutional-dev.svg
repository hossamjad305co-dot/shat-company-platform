<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGradDev" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="accentGradDev" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <pattern id="gridDev" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#fbbf24" fill-opacity="0.12" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgGradDev)" />
  <rect width="800" height="450" fill="url(#gridDev)" />

  <circle cx="680" cy="90" r="170" fill="#d97706" fill-opacity="0.18" filter="blur(45px)" />
  <circle cx="110" cy="370" r="130" fill="#f59e0b" fill-opacity="0.12" filter="blur(35px)" />

  <g transform="translate(48, 36)">
    <rect width="240" height="32" rx="16" fill="#ffffff" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="20" cy="16" r="5" fill="#fbbf24" />
    <text x="34" y="21" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">التطوير المؤسسي والحوكمة</text>
    <text x="704" y="21" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="600" fill="#fde68a" text-anchor="end">أغسطس 2026 • استشارات النظم</text>
  </g>

  <g transform="translate(48, 90)">
    <rect width="704" height="260" rx="20" fill="url(#cardGradDev)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18" />

    <g transform="translate(540, 40)">
      <circle cx="65" cy="65" r="62" fill="#ffffff" fill-opacity="0.08" stroke="#fbbf24" stroke-width="2" />
      <circle cx="65" cy="65" r="48" fill="#451a03" />
      <!-- Institutional Structure Icon -->
      <rect x="52" y="38" width="26" height="18" rx="3" fill="#fbbf24" />
      <line x1="65" y1="56" x2="65" y2="70" stroke="#fbbf24" stroke-width="2" />
      <line x1="42" y1="70" x2="88" y2="70" stroke="#fbbf24" stroke-width="2" />
      <rect x="30" y="70" width="24" height="18" rx="3" fill="#ffffff" fill-opacity="0.9" />
      <rect x="76" y="70" width="24" height="18" rx="3" fill="#ffffff" fill-opacity="0.9" />
    </g>

    <text x="490" y="65" font-family="'Cairo', system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="end">
      بناء النظم الإدارية وأدلة السياسات والإجراءات (SOPs)
    </text>
    <text x="490" y="100" font-family="'Cairo', system-ui, sans-serif" font-size="16" font-weight="600" fill="#fde68a" text-anchor="end">
      إعادة هيكلة وحوكمة منظمات المجتمع المدني والمؤسسات الشريكة
    </text>

    <text x="490" y="140" font-family="'Cairo', system-ui, sans-serif" font-size="14" font-weight="400" fill="#e2e8f0" text-anchor="end" opacity="0.95">
      تصميم الأدلة التشغيلية، لوائح الموارد البشرية، والأنظمة المالية الرقمية المعتمدة
    </text>
    <text x="490" y="165" font-family="'Cairo', system-ui, sans-serif" font-size="14" font-weight="400" fill="#e2e8f0" text-anchor="end" opacity="0.95">
      لتعزيز الجاهزية والامتثال للمنح الدولية وتوسيع قدرات الوصول والفاعلية.
    </text>

    <g transform="translate(40, 195)">
      <rect x="0" y="0" width="155" height="34" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
      <text x="77" y="22" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">⚙ أدلة SOPs معتمدة</text>

      <rect x="170" y="0" width="155" height="34" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
      <text x="247" y="22" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">📈 حوكمة الامتثال المؤسسي</text>

      <rect x="340" y="0" width="155" height="34" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
      <text x="417" y="22" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">👥 لوائح وتطوير الكادر</text>
    </g>
  </g>

  <g transform="translate(48, 385)">
    <text x="0" y="25" font-family="'Outfit', system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="1">SHAT</text>
    <text x="65" y="25" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="600" fill="#fde68a">Institutional Governance Advisory • استشارات الحوكمة والتطوير المؤسسي</text>

    <g transform="translate(560, 2)">
      <rect width="144" height="34" rx="17" fill="url(#accentGradDev)" />
      <text x="72" y="22" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">تفاصيل الحزمة ↗</text>
    </g>
  </g>
</svg>
