<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPartner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="cardGradPartner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="accentGradPartner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <pattern id="gridPartner" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgGradPartner)" />
  <rect width="800" height="450" fill="url(#gridPartner)" />

  <circle cx="680" cy="90" r="170" fill="#3b82f6" fill-opacity="0.16" filter="blur(45px)" />
  <circle cx="110" cy="370" r="130" fill="#10b981" fill-opacity="0.14" filter="blur(35px)" />

  <g transform="translate(48, 36)">
    <rect width="250" height="32" rx="16" fill="#ffffff" fill-opacity="0.15" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="20" cy="16" r="5" fill="#34d399" />
    <text x="34" y="21" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">التحالفات والشراكات • 2026</text>
    <text x="704" y="21" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="600" fill="#93c5fd" text-anchor="end">أغسطس 2026 • التعاون الدولي</text>
  </g>

  <g transform="translate(48, 90)">
    <rect width="704" height="260" rx="20" fill="url(#cardGradPartner)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18" />

    <g transform="translate(540, 40)">
      <circle cx="65" cy="65" r="62" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-width="2" />
      <circle cx="65" cy="65" r="48" fill="#0f172a" />
      <!-- Global Handshake / Alliance Nodes -->
      <circle cx="50" cy="55" r="8" fill="#34d399" />
      <circle cx="80" cy="55" r="8" fill="#60a5fa" />
      <circle cx="65" cy="80" r="8" fill="#fbbf24" />
      <line x1="50" y1="55" x2="80" y2="55" stroke="#ffffff" stroke-width="2" />
      <line x1="50" y1="55" x2="65" y2="80" stroke="#ffffff" stroke-width="2" />
      <line x1="80" y1="55" x2="65" y2="80" stroke="#ffffff" stroke-width="2" />
    </g>

    <text x="490" y="65" font-family="'Cairo', system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="end">
      توقيع مذكرات تفاهم وشراكات استراتيجية مؤسسية
    </text>
    <text x="490" y="100" font-family="'Cairo', system-ui, sans-serif" font-size="16" font-weight="600" fill="#93c5fd" text-anchor="end">
      توسيع نطاق بناء القدرات والتطوير المؤسسي الإقليمي والدولي
    </text>

    <text x="490" y="140" font-family="'Cairo', system-ui, sans-serif" font-size="14" font-weight="400" fill="#e2e8f0" text-anchor="end" opacity="0.95">
      إبرام اتفاقيات تعاون تقني ومؤسسي لدعم استدامة مشاريع الاستجابة والتعافي
    </text>
    <text x="490" y="165" font-family="'Cairo', system-ui, sans-serif" font-size="14" font-weight="400" fill="#e2e8f0" text-anchor="end" opacity="0.95">
      وتمكين القيادات المحلية في فلسطين والمنطقة بالمعايير الإنسانية الدولية.
    </text>

    <g transform="translate(40, 195)">
      <rect x="0" y="0" width="155" height="34" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
      <text x="77" y="22" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">🤝 شراكات استراتيجية</text>

      <rect x="170" y="0" width="155" height="34" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
      <text x="247" y="22" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">📍 نطاق فلسطين والدولي</text>

      <rect x="340" y="0" width="155" height="34" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
      <text x="417" y="22" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">🌐 تحالفات تنموية</text>
    </g>
  </g>

  <g transform="translate(48, 385)">
    <text x="0" y="25" font-family="'Outfit', system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="1">SHAT</text>
    <text x="65" y="25" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="600" fill="#93c5fd">Strategic Alliances &amp; Partnerships • التحالفات والشراكات المؤسسية</text>

    <g transform="translate(560, 2)">
      <rect width="144" height="34" rx="17" fill="url(#accentGradPartner)" />
      <text x="72" y="22" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">بيان الشراكة ↗</text>
    </g>
  </g>
</svg>
