<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="psBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="psCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.08" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#psBg)" />
  <rect width="800" height="450" fill="url(#grid)" />

  <circle cx="720" cy="80" r="160" fill="#A855F7" fill-opacity="0.18" />
  <circle cx="100" cy="380" r="140" fill="#F59E0B" fill-opacity="0.15" />

  <!-- Top Status Bar -->
  <g transform="translate(48, 36)">
    <rect width="250" height="32" rx="16" fill="#ffffff" fill-opacity="0.15" stroke="#C084FC" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="20" cy="16" r="5" fill="#F59E0B" />
    <text x="34" y="21" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">مهارات العرض والإلقاء • 12 ساعة</text>
    <text x="704" y="21" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="600" fill="#E9D5FF" text-anchor="end">م. مهدي الملاحي • قاعة شات التفاعلية</text>
  </g>

  <!-- Main Card -->
  <g transform="translate(48, 90)">
    <rect width="704" height="260" rx="20" fill="url(#psCard)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18" />

    <!-- Icon Badge: Podium & Microphone -->
    <g transform="translate(540, 45)">
      <circle cx="65" cy="65" r="62" fill="#ffffff" fill-opacity="0.1" stroke="#A855F7" stroke-width="2" />
      <circle cx="65" cy="65" r="48" fill="#1E1B4B" />
      <!-- Mic & Speaking Vector -->
      <path d="M60 48 A6 6 0 0 1 70 48 L70 66 A6 6 0 0 1 60 66 Z" fill="#F59E0B" />
      <path d="M53 60 A12 12 0 0 0 77 60" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <path d="M65 72 L65 82 M55 82 L75 82" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Texts -->
    <text x="500" y="70" font-family="'Cairo', system-ui, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="end">دورة تدريبية مهارات العرض والتقديم</text>
    <text x="500" y="105" font-family="'Cairo', system-ui, sans-serif" font-size="20" font-weight="800" fill="#FDE047" text-anchor="end">Public Speaking &amp; Presentation Mastery</text>
    
    <text x="500" y="150" font-family="'Cairo', system-ui, sans-serif" font-size="14" font-weight="500" fill="#E2E8F0" text-anchor="end">لغة الجسد • الإقناع والتأثير • تصميم العروض الاحترافية • كسر حاجز الخوف</text>
    <text x="500" y="180" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1" text-anchor="end">4 لقاءات تفاعلية • 120 شيكل فقط • شهادة إتمام معتمدة</text>

    <!-- Tags Row -->
    <g transform="translate(40, 205)">
      <rect width="130" height="28" rx="6" fill="#A855F7" fill-opacity="0.2" stroke="#A855F7" stroke-width="1" />
      <text x="65" y="19" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#E9D5FF" text-anchor="middle">اتصال مؤسسي</text>

      <rect x="140" width="130" height="28" rx="6" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1" />
      <text x="205" y="19" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">مقاعد محدودة</text>
    </g>
  </g>

  <!-- Bottom Brand Footnote -->
  <g transform="translate(48, 380)">
    <text x="0" y="24" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="700" fill="#94A3B8">شركة شات للتنمية والتطوير • SHAT Development &amp; Growth</text>
    <text x="704" y="24" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="700" fill="#FCD34D" text-anchor="end">متاح التسجيل المباشر بالموقع الرسمي ↗</text>
  </g>
</svg>
