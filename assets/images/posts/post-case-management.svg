<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2E4A" />
      <stop offset="50%" stop-color="#164E63" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>
    <linearGradient id="cmCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.08" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#cmBg)" />
  <rect width="800" height="450" fill="url(#grid)" />

  <circle cx="700" cy="90" r="170" fill="#06B6D4" fill-opacity="0.15" />
  <circle cx="100" cy="360" r="150" fill="#10B981" fill-opacity="0.12" />

  <!-- Top Status Bar -->
  <g transform="translate(48, 36)">
    <rect width="240" height="32" rx="16" fill="#ffffff" fill-opacity="0.15" stroke="#06B6D4" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="20" cy="16" r="5" fill="#06B6D4" />
    <text x="34" y="21" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">برنامج تدريبي معتمد • 30 ساعة</text>
    <text x="704" y="21" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="600" fill="#67E8F9" text-anchor="end">د. محمد إسليم • خبير برامج الحماية</text>
  </g>

  <!-- Main Card -->
  <g transform="translate(48, 90)">
    <rect width="704" height="260" rx="20" fill="url(#cmCard)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18" />

    <!-- Icon Badge -->
    <g transform="translate(540, 45)">
      <circle cx="65" cy="65" r="62" fill="#ffffff" fill-opacity="0.1" stroke="#06B6D4" stroke-width="2" />
      <circle cx="65" cy="65" r="48" fill="#0F2E4A" />
      <!-- Case Management Folder & Shield -->
      <path d="M45 48 L62 48 L68 56 L85 56 A4 4 0 0 1 89 60 L89 82 A4 4 0 0 1 85 86 L45 86 A4 4 0 0 1 41 82 L41 52 A4 4 0 0 1 45 48 Z" fill="#06B6D4" />
      <path d="M57 64 L65 72 L75 60" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" />
    </g>

    <!-- Texts -->
    <text x="500" y="70" font-family="'Cairo', system-ui, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="end">إعداد وتأهيل مدير حالة</text>
    <text x="500" y="105" font-family="'Cairo', system-ui, sans-serif" font-size="20" font-weight="800" fill="#38BDF8" text-anchor="end">Case Management Professional Diploma</text>
    
    <text x="500" y="150" font-family="'Cairo', system-ui, sans-serif" font-size="14" font-weight="500" fill="#E2E8F0" text-anchor="end">خطط التدخل الفردي • الإحالة متعددة القطاعات • معايير حماية الطفل</text>
    <text x="500" y="180" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="end">الرسوم: 300 شيكل فقط • شهادة إتمام معتمدة موثقة</text>

    <!-- Tags Row -->
    <g transform="translate(40, 205)">
      <rect width="130" height="28" rx="6" fill="#06B6D4" fill-opacity="0.2" stroke="#06B6D4" stroke-width="1" />
      <text x="65" y="19" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#67E8F9" text-anchor="middle">حماية الطفولة</text>

      <rect x="140" width="130" height="28" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
      <text x="205" y="19" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">التسجيل متاح</text>
    </g>
  </g>

  <!-- Bottom Brand Footnote -->
  <g transform="translate(48, 380)">
    <text x="0" y="24" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="700" fill="#94A3B8">شركة شات للتنمية والتطوير • SHAT Development &amp; Growth</text>
    <text x="704" y="24" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="end">التسجيل عبر الموقع الرسمي و Google Forms ↗</text>
  </g>
</svg>
