<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="hwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="hwCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.08" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#hwBg)" />
  <rect width="800" height="450" fill="url(#grid)" />

  <circle cx="700" cy="90" r="180" fill="#34D399" fill-opacity="0.2" />
  <circle cx="120" cy="360" r="150" fill="#FBBF24" fill-opacity="0.15" />

  <!-- Top Status Bar -->
  <g transform="translate(48, 36)">
    <rect width="270" height="32" rx="16" fill="#ffffff" fill-opacity="0.15" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="20" cy="16" r="5" fill="#FBBF24" />
    <text x="34" y="21" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">دبلوم مهني معتمد • 142 ساعة تدريبية</text>
    <text x="704" y="21" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="600" fill="#A7F3D0" text-anchor="end">13 مساقاً تخصصياً • 10 مدربين دوليين</text>
  </g>

  <!-- Main Card -->
  <g transform="translate(48, 90)">
    <rect width="704" height="260" rx="20" fill="url(#hwCard)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18" />

    <!-- Icon Badge: Humanitarian Aid & Globe -->
    <g transform="translate(540, 45)">
      <circle cx="65" cy="65" r="62" fill="#ffffff" fill-opacity="0.1" stroke="#34D399" stroke-width="2" />
      <circle cx="65" cy="65" r="48" fill="#064E3B" />
      <!-- Hands & Heart/Star -->
      <path d="M48 65 C48 55 58 48 65 54 C72 48 82 55 82 65 C82 76 65 86 65 86 C65 86 48 76 48 65 Z" fill="#FBBF24" />
      <circle cx="65" cy="40" r="4" fill="#34D399" />
    </g>

    <!-- Texts -->
    <text x="500" y="68" font-family="'Cairo', system-ui, sans-serif" font-size="23" font-weight="900" fill="#ffffff" text-anchor="end">برنامج تأهيل عامل في المجال الإنساني</text>
    <text x="500" y="100" font-family="'Cairo', system-ui, sans-serif" font-size="20" font-weight="800" fill="#FDE047" text-anchor="end">«من المبادئ إلى الممارسة» • 3 أشهر</text>
    
    <text x="500" y="146" font-family="'Cairo', system-ui, sans-serif" font-size="14" font-weight="500" fill="#E2E8F0" text-anchor="end">معايير Sphere • CHS • PSEA • إدارة دورة المشروع PCM • المتابعة والتقييم MEAL</text>
    <text x="500" y="178" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1" text-anchor="end">تقسيط ميسر خلال فترة التدريب • شهادة دبلوم معتمدة وحفل تخرج رسمي</text>

    <!-- Tags Row -->
    <g transform="translate(40, 205)">
      <rect width="130" height="28" rx="6" fill="#34D399" fill-opacity="0.2" stroke="#34D399" stroke-width="1" />
      <text x="65" y="19" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#A7F3D0" text-anchor="middle">دبلوم شامل</text>

      <rect x="140" width="130" height="28" rx="6" fill="#FBBF24" fill-opacity="0.2" stroke="#FBBF24" stroke-width="1" />
      <text x="205" y="19" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">تسديد بالتقسيط</text>
    </g>
  </g>

  <!-- Bottom Brand Footnote -->
  <g transform="translate(48, 380)">
    <text x="0" y="24" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="700" fill="#A7F3D0">شركة شات للتنمية والتطوير • SHAT Development &amp; Growth</text>
    <text x="704" y="24" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="end">التسجيل متاح عبر الاستمارة الإلكترونية الرسمية ↗</text>
  </g>
</svg>
