<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPsea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b36" />
      <stop offset="50%" stop-color="#0e2a52" />
      <stop offset="100%" stop-color="#061224" />
    </linearGradient>
    <linearGradient id="cardGradPsea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="accentGradPsea" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <pattern id="gridPsea" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGradPsea)" />
  <rect width="800" height="450" fill="url(#gridPsea)" />

  <!-- Ambient Light Orbs -->
  <circle cx="680" cy="100" r="170" fill="#0284c7" fill-opacity="0.18" filter="blur(45px)" />
  <circle cx="100" cy="360" r="130" fill="#38bdf8" fill-opacity="0.12" filter="blur(35px)" />

  <!-- Top Status Bar -->
  <g transform="translate(48, 36)">
    <rect width="230" height="32" rx="16" fill="#ffffff" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="20" cy="16" r="5" fill="#38bdf8" />
    <text x="34" y="21" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">سياسات وصون الكرامة • PSEA</text>

    <!-- Post Date -->
    <text x="704" y="21" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="600" fill="#bae6fd" text-anchor="end">سبتمبر 2026 • استشارات الحماية</text>
  </g>

  <!-- Main Focal Card -->
  <g transform="translate(48, 90)">
    <rect width="704" height="260" rx="20" fill="url(#cardGradPsea)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18" />

    <!-- Left Graphic Shield Icon -->
    <g transform="translate(540, 40)">
      <circle cx="65" cy="65" r="62" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-width="2" />
      <circle cx="65" cy="65" r="48" fill="#0c2344" />
      <!-- Shield & Lock Symbol -->
      <path d="M65 35 Q85 45 92 60 Q85 92 65 100 Q45 92 38 60 Q45 45 65 35 Z" fill="#0284c7" fill-opacity="0.8" stroke="#38bdf8" stroke-width="2" />
      <circle cx="65" cy="64" r="8" fill="#ffffff" />
      <path d="M65 72 L65 80" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Main Title & Description -->
    <text x="490" y="65" font-family="'Cairo', system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="end">
      منظومة الحماية وصون الكرامة المؤسسية (PSEA)
    </text>
    <text x="490" y="100" font-family="'Cairo', system-ui, sans-serif" font-size="16" font-weight="600" fill="#7dd3fc" text-anchor="end">
      بناء سياسات عدم الإضرار وقنوات الإبلاغ الآمنة والسرية
    </text>

    <text x="490" y="140" font-family="'Cairo', system-ui, sans-serif" font-size="14" font-weight="400" fill="#e2e8f0" text-anchor="end" opacity="0.95">
      تطوير أطر الحوكمة الوقائية، وتدريب نقاط الاتصال في المنظمات الإنسانية
    </text>
    <text x="490" y="165" font-family="'Cairo', system-ui, sans-serif" font-size="14" font-weight="400" fill="#e2e8f0" text-anchor="end" opacity="0.95">
      لضمان بيئة عمل آمنة خالية من الاستغلال، وحماية الفئات الأشد هشاشة.
    </text>

    <!-- Highlight Badges Inside Card -->
    <g transform="translate(40, 195)">
      <rect x="0" y="0" width="155" height="34" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
      <text x="77" y="22" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">🛡 قنوات إبلاغ سرية</text>

      <rect x="170" y="0" width="155" height="34" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
      <text x="247" y="22" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">⚖ مبادئ Do No Harm</text>

      <rect x="340" y="0" width="155" height="34" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
      <text x="417" y="22" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">🔍 تدقيق الامتثال الوقائي</text>
    </g>
  </g>

  <!-- Bottom Brand Watermark Strip -->
  <g transform="translate(48, 385)">
    <text x="0" y="25" font-family="'Outfit', system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="1">SHAT</text>
    <text x="65" y="25" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="600" fill="#7dd3fc">Safeguarding &amp; Protection Advisory • استشارات الحماية والمساءلة</text>

    <!-- Social View Indicator -->
    <g transform="translate(560, 2)">
      <rect width="144" height="34" rx="17" fill="url(#accentGradPsea)" />
      <text x="72" y="22" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">تقرير الاستشارة ↗</text>
    </g>
  </g>
</svg>
